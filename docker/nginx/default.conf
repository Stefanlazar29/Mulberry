upstream api {
    server api:10000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    client_max_body_size 20M;

    # ── API routes → FastAPI ──────────────────────────────────────────────────
    location ~ ^/(health|me|auth|assistant|cloud|mlbr|docs|openapi\.json)(/|$) {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Static frontend files ─────────────────────────────────────────────────
    # Files are baked into the image at /app; nginx container needs them via a
    # shared volume if you want to serve them here.  Until then, the API
    # container (FastAPI + StaticFiles) is the fallback for everything else.
    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://api;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health probe (nginx-level, no backend needed) ─────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
