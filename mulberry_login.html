<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mulberry — Bun venit</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--yellow:#E1FF00;--green:#00c76a;--font:'Inter',sans-serif}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;
  background:radial-gradient(ellipse at top right,#00c76a 0%,#006633 40%,#003d1f 100%);
}

.logo{display:flex;align-items:center;justify-content:center;margin-bottom:44px;opacity:.96}

.hero{text-align:center;margin-bottom:48px;max-width:340px}
.hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px
}
.hero-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.hero-title{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.6px;line-height:1.15;margin-bottom:12px}
.hero-sub{font-size:14px;color:rgba(255,255,255,.55);line-height:1.65}

.btns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:360px}

.btn{
  width:100%;padding:15px 20px;border-radius:14px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .18s;letter-spacing:-.1px;border:2px solid transparent
}
.btn-yellow{
  background:var(--yellow);color:#1a1a00;border-color:var(--yellow);
  box-shadow:0 4px 28px rgba(225,255,0,.22)
}
.btn-yellow:hover{background:#d4ee00;border-color:#d4ee00;transform:translateY(-1px);box-shadow:0 8px 36px rgba(225,255,0,.32)}
.btn-yellow svg{stroke:#1a1a00}
.btn-outline{
  background:transparent;color:#fff;border-color:rgba(255,255,255,.35)
}
.btn-outline:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.65);transform:translateY(-1px)}

.divider{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;margin:4px 0}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.12)}
.divider span{font-size:12px;color:rgba(255,255,255,.3)}

.footer-txt{
  margin-top:36px;font-size:11.5px;color:rgba(255,255,255,.3);
  text-align:center;line-height:1.8
}
.footer-txt a{color:rgba(255,255,255,.5);text-decoration:none;font-weight:600}
.footer-txt a:hover{color:#fff}

.trust-row{
  display:flex;align-items:center;justify-content:center;gap:18px;
  margin-top:28px;width:100%;max-width:360px
}
.trust-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.4)}
.trust-item svg{width:12px;height:12px;stroke:rgba(255,255,255,.4)}
</style>
</head>
<body>

<div class="logo">
  <svg width="160" height="40" viewBox="0 0 340 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="8" width="64" height="64" rx="16" fill="#fff"/>
    <path d="M32 16 A16 16 0 0 1 48 32 L44 32 A12 12 0 0 0 20 32 L16 32 A16 16 0 0 1 32 16Z" fill="#00c76a"/>
    <rect x="22" y="48" width="20" height="5" rx="2.5" fill="#00c76a"/>
    <rect x="26" y="42" width="12" height="5" rx="2.5" fill="#00c76a"/>
    <text x="80" y="52" font-family="'Inter',sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-1">Mulberry</text>
  </svg>
</div>

<div class="hero">
  <div class="hero-tag"><div class="hero-tag-dot"></div>Mobilitate inteligentă</div>
  <div class="hero-title">Totul despre<br>mașina ta,<br>într-un loc.</div>
  <div class="hero-sub">YellowCard digital · MulberryGO · Asigurare · AI auto — gratuit pentru tine.</div>
</div>

<div class="btns">
  <button class="btn btn-yellow" onclick="window.location.href='mulberry_auth.html?mode=register'">
    <svg width="17" height="17" fill="none" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    Creează cont gratuit
  </button>

  <div class="divider"><div class="divider-line"></div><span>sau</span><div class="divider-line"></div></div>

  <button class="btn btn-outline" onclick="window.location.href='mulberry_auth.html?mode=login'">
    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Conectare — am deja cont
  </button>
</div>

<div class="trust-row">
  <div class="trust-item">
    <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Date în România
  </div>
  <div class="trust-item">
    <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    SSL securizat
  </div>
  <div class="trust-item">
    <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    Gratuit
  </div>
</div>

<div class="footer-txt">
  <a href="#">Termeni</a> · <a href="#">Confidențialitate</a><br>
  © 2026 Mulberry · B2B2C Assurance
</div>

</body>
</html>
