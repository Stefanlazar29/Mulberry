name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.225.100.151
          username: stefan
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 443
          source: "*.html,*.css,*.png,*.svg,*.jpg,*.ico,js/**,css/**"
          target: "/home/stefan/mulberry/"
          overwrite: true

      - name: Deploy to container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.100.151
          username: stefan
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 443
          script: |
            for f in ~/mulberry/*.html ~/mulberry/*.css ~/mulberry/*.png ~/mulberry/*.svg ~/mulberry/*.jpg ~/mulberry/*.ico; do
              [ -f "$f" ] && docker cp "$f" mulberry-api-1:/app/
            done
            docker cp ~/mulberry/js/ mulberry-api-1:/app/js/ 2>/dev/null || true
            docker cp ~/mulberry/css/ mulberry-api-1:/app/css/ 2>/dev/null || true
            docker exec mulberry-nginx-1 nginx -s reload
            echo "Deploy OK - $(date)"
